<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>표지</title>
<meta name="viewport" content="width=1920, height=1080">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg-deep:#05080f;--bg-mid:#0b1220;--cyan:#5fb8e8;--amber:#e8b34a;--line:rgba(95,184,232,0.18);}
  html,body{background:var(--bg-deep);}
  .font-mono{font-family:'JetBrains Mono',monospace;}
  .font-kr{font-family:'Noto Sans KR','Pretendard',sans-serif;}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:radial-gradient(ellipse at 20% 0%, rgba(95,184,232,0.08) 0%, transparent 55%),radial-gradient(ellipse at 85% 100%, rgba(232,179,74,0.05) 0%, transparent 50%),linear-gradient(180deg,#05080f 0%, #0b1220 100%);}
  .grid-overlay{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(95,184,232,0.05) 1px, transparent 1px),linear-gradient(90deg, rgba(95,184,232,0.05) 1px, transparent 1px);background-size:64px 64px;-webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.55) 60%, rgba(0,0,0,0.9) 100%);}
  .scanlines{position:absolute;inset:0;pointer-events:none;background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 3px);}
  .vignette{position:absolute;inset:0;pointer-events:none;box-shadow: inset 0 0 220px 40px rgba(0,0,0,0.65);}
  .chamfer{clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);}
  .chamfer-sm{clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);}
  .panel{background: linear-gradient(180deg, rgba(20,35,55,0.55) 0%, rgba(10,18,32,0.55) 100%);border: 1px solid var(--line);backdrop-filter: blur(2px);}
  .header-label{font-family:'JetBrains Mono',monospace;letter-spacing:0.12em;}
</style>
</head>
<body class="m-0 p-0">
<div id="stage">
  <div class="grid-overlay"></div>
  <div class="scanlines"></div>

  <div class="absolute" style="top:56px;left:80px;width:22px;height:22px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan);opacity:0.7;"></div>
  <div class="absolute" style="top:56px;right:80px;width:22px;height:22px;border-top:2px solid var(--cyan);border-right:2px solid var(--cyan);opacity:0.7;"></div>
  <div class="absolute" style="bottom:56px;left:80px;width:22px;height:22px;border-bottom:2px solid var(--cyan);border-left:2px solid var(--cyan);opacity:0.4;"></div>
  <div class="absolute" style="bottom:56px;right:80px;width:22px;height:22px;border-bottom:2px solid var(--cyan);border-right:2px solid var(--cyan);opacity:0.4;"></div>

  <header id="header" class="absolute top-0 left-0 w-full flex items-center justify-between" style="padding:56px 80px 0 80px;">
    <div class="flex items-center gap-3">
      <span class="header-label text-[20px] text-[#5fb8e8]">00 //</span>
      <span class="header-label text-[20px] text-white/70">COVER</span>
    </div>
    <div class="header-label text-[16px] text-white/30 tracking-widest">WHO IS HUMAN · SYSTEM ONLINE</div>
  </header>

  <main class="absolute" style="top:0;left:0;width:1920px;height:1080px;">
    <div class="absolute" style="left:80px;top:230px;width:1760px;">
      <div class="flex items-center gap-4 mb-8">
        <span class="header-label text-[24px] text-[#e8b34a] tracking-[0.15em]">SOCIAL DEDUCTION // 2026 · 물리법칙 · 제한</span>
      </div>
      <h1 class="font-kr font-black text-white leading-[1.02]" style="font-size:150px;">
        누가 <span class="text-[#5fb8e8]">인간</span>인가?
      </h1>
      <p class="font-kr font-bold text-white/85 mt-10" style="font-size:30px;">
        식별 표지 없는 AI 를 물리 게임과 대화로 가려내는 3D 심리 추리 게임
      </p>

      <div class="flex items-center gap-6 mt-16">
        <div class="panel chamfer-sm px-8 py-5 flex items-center gap-4">
          <i class="fa-solid fa-building-shield text-[#5fb8e8] text-[22px]"></i>
          <span class="font-mono text-white/80 text-[20px] tracking-wide">특수인공지능대응센터</span>
        </div>
        <div class="panel chamfer-sm px-8 py-5 flex items-center gap-4">
          <i class="fa-solid fa-users text-[#5fb8e8] text-[22px]"></i>
          <span class="font-mono text-white/80 text-[20px] tracking-wide">사람 3~8명 + AI 1좌석</span>
        </div>
        <div class="panel chamfer-sm px-8 py-5 flex items-center gap-4">
          <i class="fa-solid fa-stopwatch text-[#e8b34a] text-[22px]"></i>
          <span class="font-mono text-white/80 text-[20px] tracking-wide">한 판 약 5분</span>
        </div>
      </div>
    </div>

    <div class="absolute" style="right:100px;top:260px;width:420px;height:420px;" >
      <svg width="420" height="420" viewBox="0 0 420 420" fill="none">
        <circle cx="210" cy="210" r="200" stroke="#5fb8e8" stroke-opacity="0.15" stroke-width="1"/>
        <circle cx="210" cy="210" r="140" stroke="#5fb8e8" stroke-opacity="0.18" stroke-width="1"/>
        <circle cx="210" cy="210" r="80" stroke="#5fb8e8" stroke-opacity="0.22" stroke-width="1"/>
        <line x1="210" y1="10" x2="210" y2="410" stroke="#5fb8e8" stroke-opacity="0.12"/>
        <line x1="10" y1="210" x2="410" y2="210" stroke="#5fb8e8" stroke-opacity="0.12"/>
        <circle cx="210" cy="210" r="3" fill="#e8b34a"/>
        <circle cx="290" cy="140" r="4" fill="#5fb8e8"/>
        <circle cx="140" cy="290" r="4" fill="#5fb8e8"/>
      </svg>
    </div>
  </main>

  <footer id="footer" class="absolute bottom-0 left-0 w-full flex items-center justify-between" style="padding:0 80px 48px 80px;">
    <span class="font-mono text-white/40 text-[16px] tracking-wider">WHO IS HUMAN · 특수인공지능대응센터</span>
    <span class="font-mono text-white/40 text-[16px] tracking-wider">01 / 15</span>
  </footer>

  <div class="vignette"></div>
</div>
</body>
</html>
