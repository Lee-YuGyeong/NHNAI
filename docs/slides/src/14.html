<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>감사합니다</title>
<meta name="viewport" content="width=1920, height=1080">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg-deep:#05080f;--bg-mid:#0b1220;--cyan:#5fb8e8;--amber:#e8b34a;--line:rgba(95,184,232,0.18);}
  html,body{background:var(--bg-deep);}
  .font-mono{font-family:'JetBrains Mono',monospace;}
  .font-kr{font-family:'Noto Sans KR',sans-serif;}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
    background:radial-gradient(ellipse at 50% 30%, rgba(95,184,232,0.1) 0%, transparent 60%),radial-gradient(ellipse at 85% 100%, rgba(232,179,74,0.05) 0%, transparent 50%),linear-gradient(180deg,#05080f 0%, #0b1220 100%);}
  .grid-overlay{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(95,184,232,0.05) 1px, transparent 1px),linear-gradient(90deg, rgba(95,184,232,0.05) 1px, transparent 1px);background-size:64px 64px;-webkit-mask-image: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 65%);}
  .scanlines{position:absolute;inset:0;pointer-events:none;background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 3px);}
  .vignette{position:absolute;inset:0;pointer-events:none;box-shadow: inset 0 0 260px 60px rgba(0,0,0,0.7);}
  .chamfer-sm{clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);}
  .panel{background: linear-gradient(180deg, rgba(20,35,55,0.55) 0%, rgba(10,18,32,0.55) 100%);border: 1px solid var(--line);}
  .header-label{font-family:'JetBrains Mono',monospace;letter-spacing:0.12em;}
</style>
</head>
<body class="m-0 p-0">
<div id="stage">
  <div class="grid-overlay"></div>
  <div class="scanlines"></div>

  <header id="header" class="absolute top-0 left-0 w-full flex items-center justify-between" style="padding:56px 80px 0 80px;">
    <div class="flex items-center gap-3">
      <span class="header-label text-[20px] text-[#5fb8e8]">DEMO //</span>
      <span class="header-label text-[20px] text-white/70">WHO IS HUMAN</span>
    </div>
    <div class="header-label text-[16px] text-white/30 tracking-widest">WHO IS HUMAN · SYSTEM ONLINE</div>
  </header>

  <main class="absolute flex flex-col items-center justify-center text-center" style="left:0;top:0;width:1920px;height:1080px;">
    <h1 class="font-kr font-black text-[#5fb8e8]" style="font-size:140px;">감사합니다</h1>
  </main>

  <footer id="footer" class="absolute bottom-0 left-0 w-full flex items-center justify-between" style="padding:0 80px 48px 80px;">
    <span class="font-mono text-white/40 text-[16px] tracking-wider">WHO IS HUMAN · 특수인공지능대응센터</span>
    <span class="font-mono text-white/40 text-[16px] tracking-wider">15 / 15</span>
  </footer>

  <div class="vignette"></div>
</div>
</body>
</html>
